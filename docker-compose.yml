services:
  db:
    image: postgres:16-alpine
    container_name: golfgo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-golfgo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-golfgo}
      POSTGRES_DB: ${DB_NAME:-golfgo}
    volumes:
      - golfgo_pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-golfgo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: golfgo-backend
    restart: unless-stopped
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-golfgo}
      DB_PASSWORD: ${DB_PASSWORD:-golfgo}
      DB_NAME: ${DB_NAME:-golfgo}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"

  frontend:
    build: ./frontend
    container_name: golfgo-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  golfgo_pgdata:
